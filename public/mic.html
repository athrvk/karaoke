<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mic Streamer (Sender)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            margin-bottom: 2rem;
        }

        button {
            background: #007aff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background: #0056b3;
        }

        .status {
            margin-top: 20px;
            color: #888;
        }

        .recording {
            color: #ff3b30;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <h1>🎙️ Mic Streamer</h1>
    <div style="margin-bottom: 20px;">
        <button id="startBtn">Start Streaming</button>
    </div>
    <div id="status" class="status">Ready</div>

    <!-- Silent audio to keep iOS AudioSession active in background -->
    <audio id="silentAudio" loop playsinline style="display:none;">
        <source
            src="data:audio/mp3;base64,SUQzBAAAAAABAFRYWFgAAAASAAADbWFqb3JfYnJhbmQAbXA0MgBUWFhYAAAAEQAAA21pbm9yX3ZlcnNpb24AMABUWFhYAAAAHAAAA2NvbXBhdGlibGVfYnJhbmRzAGlzb21tcDQyAFRTU0UAAAAOAAADTGF2ZjU3LjU2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
            type="audio/mp3">
    </audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const silentAudio = document.getElementById('silentAudio');

        let localStream;
        const peerConnections = {};
        let isStreaming = false;

        const iceServers = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        socket.on('connect', () => {
            console.log('Connected to signaling');
        });

        async function createPeerConnection(targetSocketId) {
            console.log(`Creating PeerConnection for ${targetSocketId}`);
            if (peerConnections[targetSocketId]) {
                console.warn(`PC for ${targetSocketId} already exists, skipping`);
                return;
            }

            const pc = new RTCPeerConnection(iceServers);
            peerConnections[targetSocketId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', {
                        target: targetSocketId,
                        candidate: event.candidate
                    });
                }
            };

            pc.onconnectionstatechange = () => {
                console.log(`Connection state with ${targetSocketId}: ${pc.connectionState}`);
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    delete peerConnections[targetSocketId];
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            socket.emit('offer', {
                target: targetSocketId,
                sdp: offer
            });
        }

        socket.on('user-joined', (userId) => {
            console.log('User joined:', userId);
            if (isStreaming) {
                createPeerConnection(userId);
            }
        });

        socket.on('existing-speakers', (userIds) => {
            console.log('Found existing speakers:', userIds);
            if (isStreaming) {
                userIds.forEach(id => createPeerConnection(id));
            }
        });

        socket.on('user-left', (userId) => {
            console.log('User left:', userId);
            if (peerConnections[userId]) {
                peerConnections[userId].close();
                delete peerConnections[userId];
            }
        });

        startBtn.addEventListener('click', async () => {
            if (isStreaming) {
                location.reload();
                return;
            }

            try {
                silentAudio.play().catch(e => console.log('Silent audio play failed', e));
                socket.emit('register-as-mic');

                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 2,
                        sampleRate: 48000,
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        latency: 0
                    },
                    video: false
                });

                const audioTrack = localStream.getAudioTracks()[0];
                const settings = audioTrack.getSettings();
                statusDiv.innerText = `🔴 Streaming (${settings.sampleRate}Hz)...`;
                statusDiv.classList.add('recording');
                startBtn.innerText = 'Stop Streaming';
                startBtn.style.background = '#ff3b30';
                isStreaming = true;

            } catch (err) {
                console.error('Error starting stream:', err);
                statusDiv.innerText = 'Error: ' + err.message;
            }
        });

        socket.on('answer', async (payload) => {
            console.log('Received Answer from', payload.sender);
            const pc = peerConnections[payload.sender];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
            }
        });

        socket.on('ice-candidate', async (payload) => {
            const pc = peerConnections[payload.sender];
            if (pc) {
                try {
                    await pc.addIceCandidate(payload.candidate);
                } catch (e) {
                    console.error('Error adding received ice candidate', e);
                }
            }
        });
    </script>
</body>

</html>
