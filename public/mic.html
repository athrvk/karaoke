<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mic Streamer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.active {
            background: #28cd41;
            box-shadow: 0 0 12px rgba(40, 205, 65, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .status-text {
            font-size: 0.95rem;
            color: #666;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .info-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .info-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #333;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ff3b30;
            color: white;
        }

        .listeners {
            margin-top: 20px;
            padding: 16px;
            background: #e8f5e9;
            border-radius: 12px;
            text-align: center;
        }

        .listeners-count {
            font-size: 2rem;
            font-weight: 700;
            color: #28cd41;
        }

        .listeners-label {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>

<body>
    <button class="back-btn" onclick="location.href='/'">← Back</button>

    <div class="container">
        <div class="header">
            <h1>🎙️ Microphone</h1>
            <p class="subtitle">Stream your audio</p>
        </div>

        <div class="status-card">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <div class="status-text" id="statusText">Ready to stream</div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Quality</div>
                    <div class="info-value" id="quality">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Connection</div>
                    <div class="info-value" id="connection">Idle</div>
                </div>
            </div>
        </div>

        <button class="btn btn-primary" id="startBtn">Start Streaming</button>

        <button class="btn btn-secondary" id="echoBtn" style="display: none; margin-top: 12px; background: #6c757d;">
            Enable Echo
        </button>

        <div class="listeners" id="listenersBox" style="display: none;">
            <div class="listeners-count" id="listenersCount">0</div>
            <div class="listeners-label">Active Listeners</div>
        </div>
    </div>

    <audio id="silentAudio" loop playsinline style="display:none;">
        <source
            src="data:audio/mp3;base64,SUQzBAAAAAABAFRYWFgAAAASAAADbWFqb3JfYnJhbmQAbXA0MgBUWFhYAAAAEQAAA21pbm9yX3ZlcnNpb24AMABUWFhYAAAAHAAAA2NvbXBhdGlibGVfYnJhbmRzAGlzb21tcDQyAFRTU0UAAAAOAAADTGF2ZjU3LjU2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
            type="audio/mp3">
    </audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const startBtn = document.getElementById('startBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const qualityEl = document.getElementById('quality');
        const connectionEl = document.getElementById('connection');
        const listenersBox = document.getElementById('listenersBox');
        const listenersCount = document.getElementById('listenersCount');
        const silentAudio = document.getElementById('silentAudio');

        let localStream;
        const peerConnections = {};
        let isStreaming = false;

        const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        socket.on('connect', () => {
            connectionEl.textContent = 'Connected';
        });

        async function createPeerConnection(targetSocketId) {
            if (peerConnections[targetSocketId]) return;

            const pc = new RTCPeerConnection(iceServers);
            peerConnections[targetSocketId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { target: targetSocketId, candidate: event.candidate });
                }
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    delete peerConnections[targetSocketId];
                    updateListenerCount();
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('offer', { target: targetSocketId, sdp: offer });

            updateListenerCount();
        }

        function updateListenerCount() {
            const count = Object.keys(peerConnections).length;
            listenersCount.textContent = count;
            listenersBox.style.display = count > 0 ? 'block' : 'none';
        }

        socket.on('user-joined', (userId) => {
            if (isStreaming) createPeerConnection(userId);
        });

        socket.on('existing-speakers', (userIds) => {
            if (isStreaming) userIds.forEach(id => createPeerConnection(id));
        });

        socket.on('user-left', (userId) => {
            if (peerConnections[userId]) {
                peerConnections[userId].close();
                delete peerConnections[userId];
                updateListenerCount();
            }
        });

        const echoBtn = document.getElementById('echoBtn');
        let echoEnabled = false;
        let localAudioElement = null;

        // Echo button handler
        echoBtn.addEventListener('click', () => {
            echoEnabled = !echoEnabled;

            if (echoEnabled) {
                // Create audio element to play back local stream
                if (!localAudioElement) {
                    localAudioElement = new Audio();
                    localAudioElement.srcObject = localStream;
                    localAudioElement.volume = 0.5; // 50% volume to avoid feedback
                }
                localAudioElement.play();
                echoBtn.textContent = 'Disable Echo';
                echoBtn.style.background = '#28cd41';
            } else {
                if (localAudioElement) {
                    localAudioElement.pause();
                    localAudioElement.srcObject = null;
                }
                echoBtn.textContent = 'Enable Echo';
                echoBtn.style.background = '#6c757d';
            }
        });

        startBtn.addEventListener('click', async () => {
            if (isStreaming) {
                location.reload();
                return;
            }

            try {
                silentAudio.play().catch(e => console.log(e));
                socket.emit('register-as-mic');

                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { channelCount: 2, sampleRate: 48000, echoCancellation: false, noiseSuppression: false, autoGainControl: false, latency: 0 },
                    video: false
                });

                const settings = localStream.getAudioTracks()[0].getSettings();
                qualityEl.textContent = `${settings.sampleRate / 1000}kHz`;
                statusText.textContent = 'Streaming...';
                statusDot.classList.add('active');
                connectionEl.textContent = 'P2P';
                startBtn.textContent = 'Stop Streaming';
                startBtn.classList.remove('btn-primary');
                startBtn.classList.add('btn-danger');
                echoBtn.style.display = 'block'; // Show echo button
                isStreaming = true;

            } catch (err) {
                statusText.textContent = 'Error: ' + err.message;
            }
        });

        socket.on('answer', async (payload) => {
            const pc = peerConnections[payload.sender];
            if (pc) await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        });

        socket.on('ice-candidate', async (payload) => {
            const pc = peerConnections[payload.sender];
            if (pc) {
                try {
                    await pc.addIceCandidate(payload.candidate);
                } catch (e) {
                    console.error(e);
                }
            }
        });
    </script>
</body>

</html>
