<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singer Mode - Karaoke Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.active {
            background: #28cd41;
            box-shadow: 0 0 12px rgba(40, 205, 65, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .status-text {
            font-size: 0.95rem;
            color: #666;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .info-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .info-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #333;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ff3b30;
            color: white;
        }

        .listeners {
            margin-top: 20px;
            padding: 16px;
            background: #e8f5e9;
            border-radius: 12px;
            text-align: center;
        }

        .listeners-count {
            font-size: 2rem;
            font-weight: 700;
            color: #28cd41;
        }

        .listeners-label {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>

<body>
    <button class="back-btn" onclick="location.href='/'">← Back</button>

    <div class="container">
        <div class="header">
            <h1>� Singer Mode</h1>
            <p class="subtitle">Stream your performance live</p>
        </div>

        <div style="background: #e3f2fd; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            <div style="font-size: 0.75rem; color: #1976d2; text-transform: uppercase; letter-spacing: 0.5px;">Room ID</div>
            <div style="font-size: 1.1rem; font-weight: 600; color: #0d47a1; font-family: monospace;" id="roomDisplay"></div>
        </div>

        <div class="status-card">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <div class="status-text" id="statusText">Ready to stream</div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Quality</div>
                    <div class="info-value" id="quality">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Connection</div>
                    <div class="info-value" id="connection">Idle</div>
                </div>
            </div>
        </div>

        <button class="btn btn-primary" id="startBtn">Start Performance</button>

        <button class="btn btn-secondary" id="echoBtn" style="display: none; margin-top: 12px; background: #6c757d;">
            Enable Reverb
        </button>

        <div class="listeners" id="listenersBox" style="display: none;">
            <div class="listeners-count" id="listenersCount">0</div>
            <div class="listeners-label">Live Audience</div>
        </div>
    </div>

    <audio id="silentAudio" loop playsinline style="display:none;">
        <source
            src="data:audio/mp3;base64,SUQzBAAAAAABAFRYWFgAAAASAAADbWFqb3JfYnJhbmQAbXA0MgBUWFhYAAAAEQAAA21pbm9yX3ZlcnNpb24AMABUWFhYAAAAHAAAA2NvbXBhdGlibGVfYnJhbmRzAGlzb21tcDQyAFRTU0UAAAAOAAADTGF2ZjU3LjU2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
            type="audio/mp3">
    </audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const startBtn = document.getElementById('startBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const qualityEl = document.getElementById('quality');
        const connectionEl = document.getElementById('connection');
        const listenersBox = document.getElementById('listenersBox');
        const listenersCount = document.getElementById('listenersCount');
        const silentAudio = document.getElementById('silentAudio');

        // Get room ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        document.getElementById('roomDisplay').textContent = roomId;

        let localStream;
        const peerConnections = {};
        let isStreaming = false;

        const iceServers = { 
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
            iceCandidatePoolSize: 10,  // Pre-gather candidates faster
            bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require',
            iceTransportPolicy: 'all'
        };

        // Register as mic immediately when socket connects
        socket.on('connect', () => {
            connectionEl.textContent = 'Connected';
            // Don't register yet - wait until streaming starts
        });

        async function createPeerConnection(targetSocketId) {
            if (peerConnections[targetSocketId]) return;

            const pc = new RTCPeerConnection(iceServers);
            peerConnections[targetSocketId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { target: targetSocketId, candidate: event.candidate });
                }
            };

            pc.onconnectionstatechange = () => {
                console.log(`Connection to ${targetSocketId}: ${pc.connectionState}`);
                if (pc.connectionState === 'connected') {
                    connectionEl.textContent = 'P2P Active';
                }
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    pc.close();
                    delete peerConnections[targetSocketId];
                    updateListenerCount();
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log(`ICE connection to ${targetSocketId}: ${pc.iceConnectionState}`);
            };

            try {
                const offer = await pc.createOffer({
                    offerToReceiveAudio: false,
                    offerToReceiveVideo: false,
                    voiceActivityDetection: false  // Disable VAD for lower latency
                });
                
                // Optimize Opus codec for low latency
                offer.sdp = offer.sdp.replace(
                    /(a=fmtp:\d+ .*)/g,
                    '$1;cbr=1;maxaveragebitrate=510000;stereo=0;usedtx=0'
                );
                
                await pc.setLocalDescription(offer);
                socket.emit('offer', { target: targetSocketId, sdp: offer });
            } catch (err) {
                console.error('Error creating offer:', err);
                delete peerConnections[targetSocketId];
            }

            updateListenerCount();
        }

        function updateListenerCount() {
            const count = Object.keys(peerConnections).length;
            listenersCount.textContent = count;
            listenersBox.style.display = count > 0 ? 'block' : 'none';
        }

        socket.on('user-joined', (userId) => {
            if (isStreaming) createPeerConnection(userId);
        });

        socket.on('existing-speakers', (userIds) => {
            if (isStreaming) userIds.forEach(id => createPeerConnection(id));
        });

        socket.on('user-left', (userId) => {
            if (peerConnections[userId]) {
                peerConnections[userId].close();
                delete peerConnections[userId];
                updateListenerCount();
            }
        });

        const echoBtn = document.getElementById('echoBtn');
        let echoEnabled = false;
        let audioContext = null;
        let micStream = null;

        // Echo button handler - toggles echo effect
        echoBtn.addEventListener('click', () => {
            echoEnabled = !echoEnabled;
            
            if (window.echoNodes) {
                // Enable/disable echo by adjusting wet gain
                window.echoNodes.wetGain.gain.value = echoEnabled ? 0.5 : 0;
            }

            echoBtn.textContent = echoEnabled ? 'Disable Reverb' : 'Enable Reverb';
            echoBtn.style.background = echoEnabled ? '#28cd41' : '#6c757d';
        });

        startBtn.addEventListener('click', async () => {
            if (isStreaming) {
                location.reload();
                return;
            }

            try {
                silentAudio.play().catch(e => console.log(e));

                // Get original microphone stream - MONO for lower latency
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { 
                        channelCount: 1,          // Mono = 50% less data
                        sampleRate: 48000,        // Keep high quality
                        echoCancellation: false,  // No processing
                        noiseSuppression: false,  // No processing
                        autoGainControl: false,   // No processing
                        latency: 0                // Minimal latency
                    },
                    video: false
                });

                // OPTIMIZATION: Skip audio processing entirely when echo is disabled
                // This saves 5-15ms latency by avoiding Web Audio API overhead
                if (echoEnabled) {
                    // Use audio processing chain for echo effect
                    audioContext = new AudioContext({ 
                        sampleRate: 48000,
                        latencyHint: 'interactive'
                    });
                    
                    const source = audioContext.createMediaStreamSource(micStream);
                    
                    // Create a delay node for echo effect
                    const delayNode = audioContext.createDelay(5.0);
                    delayNode.delayTime.value = 0.3;
                    
                    const feedbackGain = audioContext.createGain();
                    feedbackGain.gain.value = 0.2;
                    
                    const wetGain = audioContext.createGain();
                    wetGain.gain.value = 0.5; // Echo enabled
                    
                    const dryGain = audioContext.createGain();
                    dryGain.gain.value = 1.0;
                    
                    const destination = audioContext.createMediaStreamDestination();
                    
                    // Connect: source -> delay -> feedback loop
                    source.connect(dryGain);
                    source.connect(delayNode);
                    delayNode.connect(feedbackGain);
                    feedbackGain.connect(delayNode);
                    delayNode.connect(wetGain);
                    
                    // Mix dry and wet signals
                    dryGain.connect(destination);
                    wetGain.connect(destination);
                    
                    // Store nodes for echo toggle
                    window.echoNodes = { wetGain, dryGain };
                    
                    // Use the processed stream for WebRTC
                    localStream = destination.stream;
                } else {
                    // Direct stream - LOWEST LATENCY PATH
                    // No audio processing overhead
                    localStream = micStream;
                }

                const settings = micStream.getAudioTracks()[0].getSettings();
                qualityEl.textContent = `${settings.sampleRate / 1000}kHz Mono`;
                statusText.textContent = 'Performing...';
                statusDot.classList.add('active');
                connectionEl.textContent = 'P2P';
                startBtn.textContent = 'Stop Performance';
                startBtn.classList.remove('btn-primary');
                startBtn.classList.add('btn-danger');
                echoBtn.style.display = 'block'; // Show echo button
                isStreaming = true;
                
                // Register as mic NOW (after we have the stream)
                socket.emit('register-as-mic', { room: roomId });
                // existing-speakers event will fire automatically from server

            } catch (err) {
                statusText.textContent = 'Error: ' + err.message;
            }
        });

        socket.on('answer', async (payload) => {
            const pc = peerConnections[payload.sender];
            if (pc) await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        });

        socket.on('ice-candidate', async (payload) => {
            const pc = peerConnections[payload.sender];
            if (pc && payload.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
                } catch (e) {
                    console.error('Error adding ICE candidate:', e);
                }
            }
        });
    </script>
</body>

</html>
