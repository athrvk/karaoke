<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Streamer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1rem;
            margin-bottom: 40px;
        }

        .cards {
            display: grid;
            gap: 20px;
            margin-bottom: 32px;
        }

        .card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .card-icon {
            font-size: 3rem;
            flex-shrink: 0;
        }

        .card-content h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #333;
        }

        .card-content p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }

        .info-box h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;
        }

        .info-value {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎵 Audio Streamer</h1>
        <p class="subtitle">High-quality P2P audio streaming</p>

        <div class="cards">
            <a href="/mic.html" class="card">
                <div class="card-icon">🎙️</div>
                <div class="card-content">
                    <h2>Microphone</h2>
                    <p>Stream audio from this device to multiple listeners</p>
                </div>
            </a>

            <a href="/speaker.html" class="card">
                <div class="card-icon">🔊</div>
                <div class="card-content">
                    <h2>Speaker</h2>
                    <p>Listen to audio stream from a microphone</p>
                </div>
            </a>
        </div>

        <div class="info-box">
            <h3>Features</h3>
            <div class="info-item">
                <span class="info-label">Audio Quality</span>
                <span class="info-value">48kHz Stereo</span>
            </div>
            <div class="info-item">
                <span class="info-label">Connection</span>
                <span class="info-value">P2P WebRTC</span>
            </div>
            <div class="info-item">
                <span class="info-label">Latency</span>
                <span class="info-value">Ultra-Low</span>
            </div>
            <div class="info-item">
                <span class="info-label">Listeners</span>
                <span class="info-value">Unlimited</span>
            </div>
        </div>
    </div>
</body>

</html>
