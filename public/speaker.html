<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker (Receiver)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            display: inline-block;
        }

        .qr-label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        button {
            background: #28cd41;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background: #1e9631;
        }

        .status {
            margin-top: 20px;
            color: #888;
        }

        .connected {
            color: #28cd41;
        }
    </style>
</head>

<body>
    <h1>🔊 Speaker (Receiver)</h1>

    <div class="qr-container">
        <div id="qrcode"></div>
        <div class="qr-label">Scan to join as Mic</div>
    </div>

    <button id="listenBtn">Start Listening</button>
    <div id="status" class="status">Waiting for user...</div>

    <audio id="remoteAudio" autoplay controls style="margin-top: 20px; width: 80%; max-width: 400px;"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const socket = io();
        const listenBtn = document.getElementById('listenBtn');
        const statusDiv = document.getElementById('status');
        const remoteAudio = document.getElementById('remoteAudio');

        // Generate QR Code for Mic URL
        const micUrl = `${window.location.origin}/mic.html`;
        new QRCode(document.getElementById("qrcode"), {
            text: micUrl,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        let peerConnection;
        const iceServers = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        listenBtn.addEventListener('click', () => {
            statusDiv.innerText = "Ready to receive...";
            listenBtn.style.display = 'none';
            socket.emit('register-as-speaker');
        });

        socket.on('connect', () => {
            console.log('Connected to signaling server');
        });

        socket.on('offer', async (payload) => {
            console.log('Received offer from', payload.sender);
            statusDiv.innerText = "Connecting...";

            peerConnection = new RTCPeerConnection(iceServers);

            peerConnection.ontrack = (event) => {
                console.log('Received remote track');
                remoteAudio.srcObject = event.streams[0];
                statusDiv.innerText = "🎵 Streaming Audio (P2P)";
                statusDiv.classList.add('connected');
                remoteAudio.play().catch(e => console.error("Play error:", e));
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', {
                        target: payload.sender,
                        candidate: event.candidate
                    });
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            socket.emit('answer', {
                target: payload.sender,
                sdp: answer
            });
        });

        socket.on('ice-candidate', async (payload) => {
            if (peerConnection) {
                try {
                    await peerConnection.addIceCandidate(payload.candidate);
                } catch (e) {
                    console.error('Error adding received ice candidate', e);
                }
            }
        });
    </script>
</body>

</html>
