<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
        }

        .qr-section {
            background: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            text-align: center;
            border: 2px dashed #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-label {
            color: #888;
            font-size: 0.85rem;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.active {
            background: #28cd41;
            box-shadow: 0 0 12px rgba(40, 205, 65, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .status-text {
            font-size: 0.95rem;
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #28cd41 0%, #1e9631 100%);
            color: white;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40, 205, 65, 0.4);
        }

        audio {
            width: 100%;
            margin-top: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <button class="back-btn" onclick="location.href='/'">← Back</button>

    <div class="container">
        <div class="header">
            <h1>🔊 Speaker</h1>
            <p class="subtitle">Listen to audio stream</p>
        </div>

        <div style="background: #e3f2fd; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            <div style="font-size: 0.75rem; color: #1976d2; text-transform: uppercase; letter-spacing: 0.5px;">Room ID</div>
            <div style="font-size: 1.1rem; font-weight: 600; color: #0d47a1; font-family: monospace;" id="roomDisplay"></div>
        </div>

        <div class="qr-section">
            <div id="qrcode"></div>
            <div class="qr-label">Scan to join as Mic</div>
        </div>

        <div class="status-card">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <div class="status-text" id="statusText">Waiting for user...</div>
            </div>
        </div>

        <audio id="remoteAudio" autoplay controls></audio>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const socket = io();
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const remoteAudio = document.getElementById('remoteAudio');

        // Get room ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        document.getElementById('roomDisplay').textContent = roomId;

        const micUrl = `${window.location.origin}/mic.html?room=${roomId}`;
        new QRCode(document.getElementById("qrcode"), {
            text: micUrl,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        let peerConnections = {};
        const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // Auto-register speaker on connect and start listening immediately
        socket.on('connect', () => {
            console.log('Connected to signaling server');
            socket.emit('register-as-speaker', { room: roomId });
            statusText.textContent = "Waiting for microphone...";
            statusDot.classList.add('active');
        });

        socket.on('offer', async (payload) => {
            const micId = payload.sender;
            
            // Prevent duplicate connections
            if (peerConnections[micId]) {
                console.log(`Already connected to mic ${micId}`);
                return;
            }

            statusText.textContent = "Connecting to Mic...";

            const pc = new RTCPeerConnection(iceServers);
            peerConnections[micId] = pc;

            pc.ontrack = (event) => {
                console.log('Received audio track from mic');
                statusText.textContent = "🎵 Streaming Audio";
                remoteAudio.srcObject = event.streams[0];
                remoteAudio.play().catch(e => console.error('Audio play error:', e));
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', {
                        target: micId,
                        candidate: event.candidate
                    });
                }
            };

            pc.onconnectionstatechange = () => {
                console.log(`Connection to mic ${micId}: ${pc.connectionState}`);
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    pc.close();
                    delete peerConnections[micId];
                    if (Object.keys(peerConnections).length === 0) {
                        statusText.textContent = "Waiting for microphone...";
                        remoteAudio.srcObject = null;
                    }
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log(`ICE connection to mic ${micId}: ${pc.iceConnectionState}`);
            };

            try {
                await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                socket.emit('answer', {
                    target: micId,
                    sdp: answer
                });
            } catch (err) {
                console.error('Error handling offer:', err);
                delete peerConnections[micId];
            }
        });

        socket.on('ice-candidate', async (payload) => {
            const pc = peerConnections[payload.sender];
            if (pc && payload.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
                } catch (e) {
                    console.error('Error adding ICE candidate:', e);
                }
            }
        });

        socket.on('user-left', (userId) => {
            if (peerConnections[userId]) {
                peerConnections[userId].close();
                delete peerConnections[userId];
                if (Object.keys(peerConnections).length === 0) {
                    statusText.textContent = "Waiting for microphone...";
                    remoteAudio.srcObject = null;
                }
            }
        });
    </script>
</body>

</html>
