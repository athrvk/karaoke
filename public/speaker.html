<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker (Receiver)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            margin-bottom: 2rem;
        }

        button {
            background: #28cd41;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background: #1e9631;
        }

        .status {
            margin-top: 20px;
            color: #888;
        }

        .connected {
            color: #28cd41;
        }
    </style>
</head>

<body>
    <h1>Speaker (Receiver)</h1>
    <button id="listenBtn">Start Listening</button>
    <div id="status" class="status">Waiting for user...</div>

    <!-- Audio element for playback -->
    <audio id="remoteAudio" autoplay controls style="margin-top: 20px; width: 80%;"></audio>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const listenBtn = document.getElementById('listenBtn');
        const statusDiv = document.getElementById('status');
        const remoteAudio = document.getElementById('remoteAudio');

        // Get Room ID
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        const targetPeerId = `mic-${roomId}`;

        let peer;

        listenBtn.addEventListener('click', () => {
            statusDiv.innerText = `Connecting to ${targetPeerId}...`;
            listenBtn.style.display = 'none';
            initPeer();
        });

        function initPeer() {
            peer = new Peer();

            peer.on('open', (id) => {
                console.log('My ID:', id);
                connectToMic();
            });

            peer.on('error', (err) => {
                console.log('Peer error:', err);
                // Retry if peer not found immediately? usually 'call' handles it better
            });
        }

        function connectToMic() {
            console.log('Attempting call to:', targetPeerId);

            // Initiate call
            const call = peer.call(targetPeerId, new MediaStream()); // Dummy stream to initiate

            setupCall(call);

            // Retry logic
            call.on('close', () => {
                console.log('Call closed, retrying in 2s...');
                setTimeout(connectToMic, 2000);
            });

            call.on('error', (err) => {
                console.log('Call error', err);
                setTimeout(connectToMic, 2000);
            });

            // If connection fails silently (peer offline), we need a timeout?
            // PeerJS is tricky here. Usually best to just keep retrying.
            // For MVP, we presume if 'stream' doesn't fire, we might want to re-call.
        }

        function setupCall(call) {
            call.on('stream', (stream) => {
                // If the stream is the dummy empty one we sent, ignore? 
                // No, we receive the Mic's stream.
                if (stream.getAudioTracks().length > 0) {
                    console.log('Received active stream!');
                    statusDiv.innerText = "Streaming Audio (P2P)";
                    statusDiv.classList.add('connected');
                    remoteAudio.srcObject = stream;
                    remoteAudio.play().catch(e => console.error(e));
                }
            });
        }
    </script>
</body>

</html>
