<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listener Mode - Karaoke Live</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button class="back-btn" onclick="location.href='/'">← Back</button>

    <div class="container">
        <div class="header">
            <h1>🎧 Listener Mode</h1>
            <p class="subtitle">Enjoy live performances</p>
        </div>

        <div style="background: #e3f2fd; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            <div style="font-size: 0.75rem; color: #1976d2; text-transform: uppercase; letter-spacing: 0.5px;">Room ID</div>
            <div style="font-size: 1.1rem; font-weight: 600; color: #0d47a1; font-family: monospace;" id="roomDisplay"></div>
        </div>

        <div class="qr-section">
            <div id="qrcode"></div>
            <div class="qr-label">Scan to join as Singer</div>
        </div>

        <div class="status-card">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <div class="status-text" id="statusText">Waiting for user...</div>
            </div>
        </div>

        <div class="settings-panel">
            <div class="settings-header">
                <span class="settings-icon">⚙️</span>
                <h3 class="settings-title">Playback Configuration</h3>
            </div>

            <div class="settings-section">
                <label class="control-switch">
                    <input type="checkbox" id="minBuffer">
                    <span class="switch-slider"></span>
                    <span class="switch-content">
                        <span class="switch-label">Minimize Buffering</span>
                        <span class="switch-hint">Forces immediate playback for lower latency</span>
                    </span>
                </label>
            </div>
        </div>

        <div class="mics-section" id="micsSection" style="display: none;">
            <h3>Live Performers</h3>
            <div class="mic-count" id="micCount">0</div>
            <div class="mic-count-label">Active Singers</div>
            <div class="mic-list" id="micList"></div>
        </div>

        <div id="audioContainer"></div>
        <audio id="silentAudio" loop playsinline style="display:none;">
            <source
                src="data:audio/mp3;base64,SUQzBAAAAAABAFRYWFgAAAASAAADbWFqb3JfYnJhbmQAbXA0MgBUWFhYAAAAEQAAA21pbm9yX3ZlcnNpb24AMABUWFhYAAAAHAAAA2NvbXBhdGlibGVfYnJhbmRzAGlzb21tcDQyAFRTU0UAAAAOAAADTGF2ZjU3LjU2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//tQAAAAAAtAAAAABAAAAAABAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                type="audio/mp3">
        </audio>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const socket = io();
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const audioContainer = document.getElementById('audioContainer');
        const silentAudio = document.getElementById('silentAudio');
        const micsSection = document.getElementById('micsSection');
        const micCount = document.getElementById('micCount');
        const micList = document.getElementById('micList');
        const minBufferCheckbox = document.getElementById('minBuffer');

        // Get room ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        document.getElementById('roomDisplay').textContent = roomId;

        const micUrl = `${window.location.origin}/mic.html?room=${roomId}`;
        new QRCode(document.getElementById("qrcode"), {
            text: micUrl,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        let peerConnections = {};
        let audioElements = {};
        let latencyInterval = null;
        const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let audioUnlocked = false;

        // Unlock audio on any user interaction (for browser autoplay policy)
        function unlockAudio() {
            if (audioUnlocked) return;
            // Play silent audio to unlock the audio engine
            silentAudio.play().then(() => {
                audioUnlocked = true;
                console.log('Audio unlocked for autoplay');
            }).catch((e) => {
                console.log('Audio unlock pending user interaction', e);
            });
        }

        // Unlock audio on any user interaction
        document.addEventListener('click', unlockAudio, { once: true });
        document.addEventListener('touchstart', unlockAudio, { once: true });
        
        // Try to unlock immediately on page load
        unlockAudio();

        // Handle buffer setting change
        minBufferCheckbox.addEventListener('change', () => {
            const hint = minBufferCheckbox.checked ? 0 : null;
            console.log(`Setting playoutDelayHint to ${hint}`);
            
            Object.values(peerConnections).forEach(pc => {
                pc.getReceivers().forEach(receiver => {
                    if (receiver.track.kind === 'audio') {
                        receiver.playoutDelayHint = hint;
                    }
                });
            });
        });

        // Update mic list display
        function updateMicList() {
            const count = Object.keys(peerConnections).length;
            micCount.textContent = count;
            
            if (count === 0) {
                micsSection.style.display = 'none';
                micList.innerHTML = '';
                if (latencyInterval) {
                    clearInterval(latencyInterval);
                    latencyInterval = null;
                }
            } else {
                micsSection.style.display = 'block';
                
                // Only rebuild list if number of mics changed to avoid flickering
                // But we need to update latency values dynamically
                if (micList.children.length !== count) {
                    micList.innerHTML = '';
                    Object.keys(peerConnections).forEach((micId, index) => {
                        const pc = peerConnections[micId];
                        const micItem = document.createElement('div');
                        micItem.className = 'mic-item';
                        micItem.id = `mic-item-${micId}`;
                        micItem.innerHTML = `
                            <div class="mic-item-icon">🎙️</div>
                            <div class="mic-item-info">
                                <div class="mic-item-status">${pc.connectionState || 'connecting'}</div>
                                <div class="mic-item-id">Mic #${index + 1}</div>
                                <div class="mic-item-latency" id="latency-${micId}" style="font-size: 0.8rem; color: #666;">Latency: -- ms</div>
                            </div>
                        `;
                        micList.appendChild(micItem);
                    });
                }

                // Start polling for stats if not already running
                if (!latencyInterval) {
                    latencyInterval = setInterval(updateLatencyStats, 1000);
                }
            }
        }

        async function updateLatencyStats() {
            for (const [micId, pc] of Object.entries(peerConnections)) {
                if (pc.connectionState !== 'connected') continue;

                try {
                    const stats = await pc.getStats();
                    let latency = null;

                    stats.forEach(report => {
                        if (report.type === 'inbound-rtp' && report.kind === 'audio') {
                            // Calculate jitter buffer delay
                            if (report.jitterBufferDelay && report.jitterBufferEmittedCount) {
                                const jitterDelay = report.jitterBufferDelay / report.jitterBufferEmittedCount;
                                latency = Math.round(jitterDelay * 1000);
                            }
                        }
                        // Fallback to round trip time if available (less accurate for one-way latency but useful)
                        if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.currentRoundTripTime) {
                            if (!latency) {
                                latency = Math.round(report.currentRoundTripTime * 1000 / 2); // Estimate one-way
                            }
                        }
                    });

                    const latencyEl = document.getElementById(`latency-${micId}`);
                    if (latencyEl) {
                        latencyEl.textContent = latency !== null ? `Latency: ~${latency} ms` : 'Latency: --';
                        // Color code latency
                        if (latency < 50) latencyEl.style.color = '#28cd41'; // Green
                        else if (latency < 150) latencyEl.style.color = '#ff9500'; // Orange
                        else latencyEl.style.color = '#ff3b30'; // Red
                    }
                } catch (e) {
                    console.error('Error getting stats:', e);
                }
            }
        }

        // Auto-register speaker on connect and start listening immediately
        socket.on('connect', () => {
            console.log('Connected to signaling server');
            socket.emit('register-as-speaker', { room: roomId });
            statusText.textContent = "Waiting for singer...";
            statusDot.classList.add('active');
        });

        socket.on('offer', async (payload) => {
            const micId = payload.sender;
            
            // Prevent duplicate connections
            if (peerConnections[micId]) {
                console.log(`Already connected to mic ${micId}`);
                return;
            }

            statusText.textContent = "Connecting to singer...";

            const pc = new RTCPeerConnection(iceServers);
            peerConnections[micId] = pc;

            pc.ontrack = (event) => {
                console.log('Received audio track from mic');
                statusText.textContent = "🎵 Live Performance";
                
                // Apply buffer setting immediately
                const receiver = pc.getReceivers().find(r => r.track.id === event.track.id);
                if (receiver) {
                    receiver.playoutDelayHint = minBufferCheckbox.checked ? 0 : null;
                }

                const newAudio = document.createElement('audio');
                newAudio.autoplay = true;
                newAudio.playsInline = true;
                newAudio.muted = true; // Start muted
                newAudio.srcObject = event.streams[0];
                audioContainer.appendChild(newAudio);
                audioElements[micId] = newAudio;
                
                // Try to play
                const playPromise = newAudio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('Audio playing successfully (muted)');
                            // Unmute after a short delay
                            setTimeout(() => {
                                newAudio.muted = false;
                                newAudio.volume = 1.0;
                                console.log('Audio unmuted - you should hear it now');
                            }, 500);
                        })
                        .catch(e => {
                            console.warn('Autoplay blocked, waiting for user interaction', e);
                            // Show a message to user
                            statusText.textContent = "🎵 Click anywhere to hear performance";
                            
                            // Play on next user interaction
                            const playOnInteraction = () => {
                                newAudio.muted = false;
                                newAudio.volume = 1.0;
                                newAudio.play()
                                    .then(() => {
                                        statusText.textContent = "🎵 Live Performance";
                                    })
                                    .catch(err => console.error('Play error:', err));
                                document.removeEventListener('click', playOnInteraction);
                                document.removeEventListener('touchstart', playOnInteraction);
                            };
                            document.addEventListener('click', playOnInteraction, { once: true });
                            document.addEventListener('touchstart', playOnInteraction, { once: true });
                        });
                }
                updateMicList();
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', {
                        target: micId,
                        candidate: event.candidate
                    });
                }
            };

            pc.onconnectionstatechange = () => {
                console.log(`Connection to mic ${micId}: ${pc.connectionState}`);
                updateMicList();
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    pc.close();
                    delete peerConnections[micId];
                    if (audioElements[micId]) {
                        audioElements[micId].remove();
                        delete audioElements[micId];
                    }
                    updateMicList();
                    if (Object.keys(peerConnections).length === 0) {
                        statusText.textContent = "Waiting for singer...";
                    }
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log(`ICE connection to mic ${micId}: ${pc.iceConnectionState}`);
            };

            try {
                await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                socket.emit('answer', {
                    target: micId,
                    sdp: answer
                });
            } catch (err) {
                console.error('Error handling offer:', err);
                delete peerConnections[micId];
                updateMicList();
            }
        });

        socket.on('ice-candidate', async (payload) => {
            const pc = peerConnections[payload.sender];
            if (pc && payload.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
                } catch (e) {
                    console.error('Error adding ICE candidate:', e);
                }
            }
        });

        socket.on('user-left', (userId) => {
            if (peerConnections[userId]) {
                peerConnections[userId].close();
                delete peerConnections[userId];
                if (audioElements[userId]) {
                    audioElements[userId].remove();
                    delete audioElements[userId];
                }
                updateMicList();
                if (Object.keys(peerConnections).length === 0) {
                    statusText.textContent = "Waiting for singer...";
                }
            }
        });
    </script>
</body>

</html>
