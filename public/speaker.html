<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listener Mode - Karaoke Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
        }

        .qr-section {
            background: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            text-align: center;
            border: 2px dashed #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-label {
            color: #888;
            font-size: 0.85rem;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
        }

        .status-dot.active {
            background: #28cd41;
            box-shadow: 0 0 12px rgba(40, 205, 65, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .status-text {
            font-size: 0.95rem;
            color: #666;
        }

        .mics-section {
            background: #e8f5e9;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .mics-section h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1b5e20;
            margin-bottom: 12px;
        }

        .mic-count {
            font-size: 2rem;
            font-weight: 700;
            color: #28cd41;
            text-align: center;
            margin-bottom: 8px;
        }

        .mic-count-label {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
        }

        .mic-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .mic-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mic-item-icon {
            font-size: 1.2rem;
        }

        .mic-item-info {
            flex: 1;
        }

        .mic-item-id {
            font-size: 0.75rem;
            color: #888;
            font-family: monospace;
        }

        .mic-item-status {
            font-size: 0.85rem;
            color: #28cd41;
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #28cd41 0%, #1e9631 100%);
            color: white;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40, 205, 65, 0.4);
        }

        audio {
            width: 100%;
            margin-top: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <button class="back-btn" onclick="location.href='/'">← Back</button>

    <div class="container">
        <div class="header">
            <h1>🎧 Listener Mode</h1>
            <p class="subtitle">Enjoy live performances</p>
        </div>

        <div style="background: #e3f2fd; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
            <div style="font-size: 0.75rem; color: #1976d2; text-transform: uppercase; letter-spacing: 0.5px;">Room ID</div>
            <div style="font-size: 1.1rem; font-weight: 600; color: #0d47a1; font-family: monospace;" id="roomDisplay"></div>
        </div>

        <div class="qr-section">
            <div id="qrcode"></div>
            <div class="qr-label">Scan to join as Singer</div>
        </div>

        <div class="status-card">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <div class="status-text" id="statusText">Waiting for user...</div>
            </div>
        </div>

        <div class="mics-section" id="micsSection" style="display: none;">
            <h3>Live Performers</h3>
            <div class="mic-count" id="micCount">0</div>
            <div class="mic-count-label">Active Singers</div>
            <div class="mic-list" id="micList"></div>
        </div>

        <audio id="remoteAudio" autoplay playsinline muted></audio>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const socket = io();
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const remoteAudio = document.getElementById('remoteAudio');
        const micsSection = document.getElementById('micsSection');
        const micCount = document.getElementById('micCount');
        const micList = document.getElementById('micList');

        // Get room ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        document.getElementById('roomDisplay').textContent = roomId;

        const micUrl = `${window.location.origin}/mic.html?room=${roomId}`;
        new QRCode(document.getElementById("qrcode"), {
            text: micUrl,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        let peerConnections = {};
        const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let audioUnlocked = false;

        // Unlock audio on any user interaction (for browser autoplay policy)
        function unlockAudio() {
            if (audioUnlocked) return;
            
            remoteAudio.play().then(() => {
                audioUnlocked = true;
                remoteAudio.pause(); // Pause immediately, will play when stream arrives
                console.log('Audio unlocked for autoplay');
            }).catch(() => {
                console.log('Audio unlock pending user interaction');
            });
        }

        // Unlock audio on any user interaction
        document.addEventListener('click', unlockAudio, { once: true });
        document.addEventListener('touchstart', unlockAudio, { once: true });
        
        // Try to unlock immediately on page load
        unlockAudio();

        // Update mic list display
        function updateMicList() {
            const count = Object.keys(peerConnections).length;
            micCount.textContent = count;
            
            if (count === 0) {
                micsSection.style.display = 'none';
                micList.innerHTML = '';
            } else {
                micsSection.style.display = 'block';
                micList.innerHTML = '';
                
                Object.keys(peerConnections).forEach((micId, index) => {
                    const pc = peerConnections[micId];
                    const micItem = document.createElement('div');
                    micItem.className = 'mic-item';
                    micItem.innerHTML = `
                        <div class="mic-item-icon">🎙️</div>
                        <div class="mic-item-info">
                            <div class="mic-item-status">${pc.connectionState || 'connecting'}</div>
                            <div class="mic-item-id">Mic #${index + 1}</div>
                        </div>
                    `;
                    micList.appendChild(micItem);
                });
            }
        }

        // Auto-register speaker on connect and start listening immediately
        socket.on('connect', () => {
            console.log('Connected to signaling server');
            socket.emit('register-as-speaker', { room: roomId });
            statusText.textContent = "Waiting for singer...";
            statusDot.classList.add('active');
        });

        socket.on('offer', async (payload) => {
            const micId = payload.sender;
            
            // Prevent duplicate connections
            if (peerConnections[micId]) {
                console.log(`Already connected to mic ${micId}`);
                return;
            }

            statusText.textContent = "Connecting to singer...";

            const pc = new RTCPeerConnection(iceServers);
            peerConnections[micId] = pc;

            pc.ontrack = (event) => {
                console.log('Received audio track from mic');
                statusText.textContent = "🎵 Live Performance";
                remoteAudio.srcObject = event.streams[0];
                
                // Ensure audio plays automatically
                remoteAudio.muted = false;
                remoteAudio.volume = 1.0;
                
                // Try to play, with fallback
                const playPromise = remoteAudio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('Audio playing successfully (muted)');
                            // Unmute after a short delay to bypass autoplay restrictions
                            setTimeout(() => {
                                remoteAudio.muted = false;
                                console.log('Audio unmuted - you should hear it now');
                            }, 100);
                        })
                        .catch(e => {
                            console.warn('Autoplay blocked, waiting for user interaction');
                            // Show a message to user
                            statusText.textContent = "🎵 Click anywhere to hear performance";
                            
                            // Play on next user interaction
                            const playOnInteraction = () => {
                                remoteAudio.play()
                                    .then(() => {
                                        statusText.textContent = "🎵 Live Performance";
                                    })
                                    .catch(err => console.error('Play error:', err));
                                document.removeEventListener('click', playOnInteraction);
                                document.removeEventListener('touchstart', playOnInteraction);
                            };
                            document.addEventListener('click', playOnInteraction, { once: true });
                            document.addEventListener('touchstart', playOnInteraction, { once: true });
                        });
                }
                updateMicList();
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', {
                        target: micId,
                        candidate: event.candidate
                    });
                }
            };

            pc.onconnectionstatechange = () => {
                console.log(`Connection to mic ${micId}: ${pc.connectionState}`);
                updateMicList();
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                    pc.close();
                    delete peerConnections[micId];
                    updateMicList();
                    if (Object.keys(peerConnections).length === 0) {
                        statusText.textContent = "Waiting for singer...";
                        remoteAudio.srcObject = null;
                    }
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log(`ICE connection to mic ${micId}: ${pc.iceConnectionState}`);
            };

            try {
                await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                socket.emit('answer', {
                    target: micId,
                    sdp: answer
                });
            } catch (err) {
                console.error('Error handling offer:', err);
                delete peerConnections[micId];
                updateMicList();
            }
        });

        socket.on('ice-candidate', async (payload) => {
            const pc = peerConnections[payload.sender];
            if (pc && payload.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
                } catch (e) {
                    console.error('Error adding ICE candidate:', e);
                }
            }
        });

        socket.on('user-left', (userId) => {
            if (peerConnections[userId]) {
                peerConnections[userId].close();
                delete peerConnections[userId];
                updateMicList();
                if (Object.keys(peerConnections).length === 0) {
                    statusText.textContent = "Waiting for singer...";
                    remoteAudio.srcObject = null;
                }
            }
        });
    </script>
</body>

</html>
