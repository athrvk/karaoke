<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker (Receiver)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .room-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            display: inline-block;
        }

        #qrcode {
            margin: 0 auto;
        }

        .qr-label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        button {
            background: #28cd41;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:active {
            background: #1e9631;
        }

        .status {
            margin-top: 20px;
            color: #888;
            font-size: 0.95rem;
        }

        .connected {
            color: #28cd41;
        }

        .debug {
            margin-top: 20px;
            padding: 10px;
            background: #1c1c1e;
            border-radius: 8px;
            font-size: 0.85rem;
            max-width: 500px;
            text-align: left;
            color: #aaa;
        }
    </style>
</head>

<body>
    <h1>🔊 Speaker (Receiver)</h1>
    <div class="room-badge" id="roomBadge">Room: Loading...</div>

    <div class="qr-container">
        <div id="qrcode"></div>
        <div class="qr-label">Scan to connect as Mic</div>
    </div>

    <button id="listenBtn">Start Listening</button>
    <div id="status" class="status">Waiting for user...</div>
    <div id="debug" class="debug"></div>

    <!-- Audio element for playback -->
    <audio id="remoteAudio" autoplay controls style="margin-top: 20px; width: 80%; max-width: 400px;"></audio>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const listenBtn = document.getElementById('listenBtn');
        const statusDiv = document.getElementById('status');
        const roomBadge = document.getElementById('roomBadge');
        const remoteAudio = document.getElementById('remoteAudio');
        const debugDiv = document.getElementById('debug');

        function log(msg) {
            console.log(msg);
            debugDiv.innerHTML += msg + '<br>';
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        // Get Room ID
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        const targetPeerId = `mic-${roomId}`;

        // Display Room ID
        roomBadge.innerText = `Room: ${roomId}`;
        log(`Room: ${roomId}`);
        log(`Target Mic ID: ${targetPeerId}`);

        // Generate QR Code for Mic URL
        const micUrl = `${window.location.origin}/mic.html?room=${roomId}`;
        new QRCode(document.getElementById("qrcode"), {
            text: micUrl,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        let peer;
        let currentCall;

        listenBtn.addEventListener('click', () => {
            statusDiv.innerText = `Connecting...`;
            listenBtn.style.display = 'none';
            initPeer();
        });

        function initPeer() {
            log('Creating Peer...');
            peer = new Peer();

            peer.on('open', (id) => {
                log(`✓ My Peer ID: ${id}`);
                statusDiv.innerText = 'Connected to PeerJS. Calling Mic...';
                connectToMic();
            });

            peer.on('error', (err) => {
                log(`✗ Peer Error: ${err.type} - ${err.message}`);
                statusDiv.innerText = `Error: ${err.type}`;
            });
        }

        function connectToMic() {
            log(`Calling ${targetPeerId}...`);
            statusDiv.innerText = `Calling ${targetPeerId}...`;

            // Create a dummy media stream to initiate the call
            const dummyStream = new MediaStream();
            currentCall = peer.call(targetPeerId, dummyStream);

            if (!currentCall) {
                log('✗ Call failed to initiate');
                setTimeout(connectToMic, 3000);
                return;
            }

            setupCall(currentCall);

            currentCall.on('close', () => {
                log('Call closed. Retrying in 3s...');
                statusDiv.innerText = 'Connection lost. Retrying...';
                setTimeout(connectToMic, 3000);
            });

            currentCall.on('error', (err) => {
                log(`✗ Call Error: ${err.type || err.message}`);
                statusDiv.innerText = 'Call failed. Retrying...';
                setTimeout(connectToMic, 3000);
            });
        }

        function setupCall(call) {
            let streamReceived = false;

            call.on('stream', (stream) => {
                if (stream.getAudioTracks().length > 0) {
                    streamReceived = true;
                    log('✓ Received audio stream!');
                    statusDiv.innerText = "🎵 Streaming Audio (P2P)";
                    statusDiv.classList.add('connected');
                    remoteAudio.srcObject = stream;
                    remoteAudio.play().catch(e => {
                        log(`✗ Play error: ${e.message}`);
                    });
                } else {
                    log('⚠ Received empty stream');
                }
            });

            // Timeout if no stream received
            setTimeout(() => {
                if (!streamReceived) {
                    log('⚠ No stream after 5s. Mic may not be streaming yet.');
                    statusDiv.innerText = 'Waiting for Mic to start streaming...';
                }
            }, 5000);
        }
    </script>
</body>

</html>
