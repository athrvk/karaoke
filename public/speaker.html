<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker (Receiver)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .room-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            display: inline-block;
        }

        #qrcode {
            margin: 0 auto;
        }

        .qr-label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        button {
            background: #28cd41;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:active {
            background: #1e9631;
        }

        .status {
            margin-top: 20px;
            color: #888;
        }

        .connected {
            color: #28cd41;
        }
    </style>
</head>

<body>
    <h1>🔊 Speaker (Receiver)</h1>
    <div class="room-badge" id="roomBadge">Room: Loading...</div>

    <div class="qr-container">
        <div id="qrcode"></div>
        <div class="qr-label">Scan to connect as Mic</div>
    </div>

    <button id="listenBtn">Start Listening</button>
    <div id="status" class="status">Waiting for user...</div>

    <!-- Audio element for playback -->
    <audio id="remoteAudio" autoplay controls style="margin-top: 20px; width: 80%; max-width: 400px;"></audio>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const listenBtn = document.getElementById('listenBtn');
        const statusDiv = document.getElementById('status');
        const roomBadge = document.getElementById('roomBadge');
        const remoteAudio = document.getElementById('remoteAudio');

        // Get Room ID
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default';
        const targetPeerId = `mic-${roomId}`;

        // Display Room ID
        roomBadge.innerText = `Room: ${roomId}`;

        // Generate QR Code for Mic URL
        const micUrl = `${window.location.origin}/mic.html?room=${roomId}`;
        new QRCode(document.getElementById("qrcode"), {
            text: micUrl,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        let peer;

        listenBtn.addEventListener('click', () => {
            statusDiv.innerText = `Connecting to ${targetPeerId}...`;
            listenBtn.style.display = 'none';
            initPeer();
        });

        function initPeer() {
            peer = new Peer();

            peer.on('open', (id) => {
                console.log('My ID:', id);
                connectToMic();
            });

            peer.on('error', (err) => {
                console.log('Peer error:', err);
            });
        }

        function connectToMic() {
            console.log('Attempting call to:', targetPeerId);

            const call = peer.call(targetPeerId, new MediaStream());

            setupCall(call);

            call.on('close', () => {
                console.log('Call closed, retrying in 2s...');
                setTimeout(connectToMic, 2000);
            });

            call.on('error', () => {
                setTimeout(connectToMic, 2000);
            });
        }

        function setupCall(call) {
            call.on('stream', (stream) => {
                if (stream.getAudioTracks().length > 0) {
                    console.log('Received active stream!');
                    statusDiv.innerText = "🎵 Streaming Audio (P2P)";
                    statusDiv.classList.add('connected');
                    remoteAudio.srcObject = stream;
                    remoteAudio.play().catch(e => console.error(e));
                }
            });
        }
    </script>
</body>

</html>
